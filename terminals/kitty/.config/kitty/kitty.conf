
# Font
font_family Terminess Nerd Font

# Bell
enable_audio_bell no

# Remembering window
remember_window_size yes



# BEGIN_KITTY_THEME
# Treehouse
include current-theme.conf
# END_KITTY_THEME

# allow copy paste
map cmd+c copy_from_clipboard
map cmd+v paste_from_clipboard
map shift+insert paste_from_clipboard
